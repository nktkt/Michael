[workspace]
resolver = "2"
members = [
    "crates/tomcatrs-core",
    "crates/tomcatrs-config",
    "crates/tomcatrs-coyote",
    "crates/tomcatrs-catalina",
    "crates/tomcatrs-webapp",
    "crates/tomcatrs-servlet-bridge",
    "crates/tomcatrs-jsp",
    "crates/tomcatrs-session",
    "crates/tomcatrs-security",
    "crates/tomcatrs-websocket",
    "crates/tomcatrs-observability",
    "crates/tomcatrs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/nktkt/Michael"
homepage = "https://github.com/nktkt/Michael"
authors = ["The Tomcat-RS Authors"]
description = "Tomcat-RS Compatibility Runtime — an incremental Rust rewrite of Apache Tomcat"

[workspace.dependencies]
tomcatrs-core = { path = "crates/tomcatrs-core", version = "0.1.0" }
tomcatrs-config = { path = "crates/tomcatrs-config", version = "0.1.0" }
tomcatrs-coyote = { path = "crates/tomcatrs-coyote", version = "0.1.0" }
tomcatrs-catalina = { path = "crates/tomcatrs-catalina", version = "0.1.0" }
tomcatrs-webapp = { path = "crates/tomcatrs-webapp", version = "0.1.0" }
tomcatrs-servlet-bridge = { path = "crates/tomcatrs-servlet-bridge", version = "0.1.0" }
tomcatrs-jsp = { path = "crates/tomcatrs-jsp", version = "0.1.0" }
tomcatrs-session = { path = "crates/tomcatrs-session", version = "0.1.0" }
tomcatrs-security = { path = "crates/tomcatrs-security", version = "0.1.0" }
tomcatrs-websocket = { path = "crates/tomcatrs-websocket", version = "0.1.0" }
tomcatrs-observability = { path = "crates/tomcatrs-observability", version = "0.1.0" }

# Shared third-party dependencies
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
dashmap = "6.0"
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
parking_lot = "0.12"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
