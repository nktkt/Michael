# catalina.properties - sample configuration for the Tomcat-RS Compatibility Runtime
#
# Simple key=value runtime properties. Lines beginning with '#' are comments.
# These values are read by tomcatrs-config at startup.

# Directory scanned for deployed web applications.
# This is the default appBase; a <Host appBase="..."> in server.xml overrides it.
tomcatrs.appBase=webapps

# Directory holding configuration files (server.xml, web.xml, this file).
tomcatrs.confBase=conf

# Default host name used when no <Host> matches the request Host header.
tomcatrs.defaultHost=localhost

# Access log destination. Use "stdout" to log to standard output.
tomcatrs.accessLog=logs/access.log

# Whether the deployment watcher scans appBase for changes at runtime.
tomcatrs.autoDeploy=true
