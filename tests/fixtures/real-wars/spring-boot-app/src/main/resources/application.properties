# Tomcat-RS — Spring Boot 3.x WAR fixture.
#
# Keep the application's runtime configuration to the bare minimum that
# matters for the integration test:
#
#   * Mount the app at the container root (no Spring-side context prefix).
#     Tomcat-RS deploys this WAR at whatever <Context> path it picks, so
#     the *Spring* context-path stays empty and the controller URLs line
#     up with what the test sends.
#
#   * Suppress Spring Boot's startup banner to keep the JVM-bridge test
#     log tractable.
#
#   * Drop the log floor to WARN so a passing test produces near-zero
#     output; the JVM bridge's own tracing already covers what we need.

server.servlet.context-path=/
logging.level.root=WARN
spring.main.banner-mode=off
