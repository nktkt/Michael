[package]
name = "tomcatrs-webapp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Tomcat-RS web application layer — WAR discovery, deployment, and resource access"

[dependencies]
tomcatrs-core.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `zip` is used by the annotation scanner to read `WEB-INF/lib/*.jar` archives
# (a jar is a zip). `deflate` is required because jar entries are commonly
# DEFLATE-compressed; the other default features (encryption, bzip2, zstd, …)
# are not needed for classpath scanning, so they are turned off.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
