[package]
name = "tomcatrs-servlet-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust ↔ JVM bridge for running existing Java Servlets/WARs inside the Tomcat-RS Compatibility Runtime"
# Compiles the `java/` bridge sources into `tomcatrs-bridge.jar` when the
# `jvm` feature is enabled; a clean no-op otherwise. See `build.rs`.
build = "build.rs"

[features]
default = []
# Enables the real embedded-JVM / JNI implementation. Requires a JDK at build
# time (for the `jni` crate's headers) and at run time (for `libjvm`).
jvm = ["dep:jni"]

[dependencies]
tomcatrs-core.workspace = true
tomcatrs-config.workspace = true
tomcatrs-coyote.workspace = true
tomcatrs-session.workspace = true
# `tomcatrs-webapp` is consumed only by `sci.rs` for `ClassgraphIndex` —
# the Servlet 6 `@HandlesTypes` classpath scan. The webapp crate brings
# in the existing class-file parser so the bridge does not re-implement
# JVM bytecode parsing.
tomcatrs-webapp.workspace = true
async-trait.workspace = true
tracing.workspace = true
dashmap.workspace = true
bytes.workspace = true
thiserror.workspace = true
# `async_servlet::AsyncContextState::await_completion` is part of the public
# API: it `tokio::select!`s a `tokio::sync::Notify` against a
# `tokio::time::sleep`, so tokio is a regular (not dev-only) dependency.
tokio = { workspace = true }
jni = { version = "0.21", optional = true, features = ["invocation"] }
