[package]
name = "tomcatrs-coyote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Tomcat-RS Coyote connector layer — HTTP/1.1, HTTP/2 (scaffold), AJP (scaffold), TLS (scaffold)"

[dependencies]
tomcatrs-core.workspace = true
tomcatrs-config.workspace = true
tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true

# TLS termination (behind the default-on `tls` feature). We pin rustls to the
# lighter-weight `ring` crypto backend rather than the default `aws-lc-rs`
# backend: `ring` builds with far fewer system/build dependencies (no CMake,
# no C++ toolchain) which keeps the workspace build fast and portable.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
# TLS is on by default so a plain `cargo build` exercises the rustls path.
default = ["tls"]
# Real TLS termination via rustls + tokio-rustls. With this feature off the
# `tls` module still compiles, but `TlsAcceptor` becomes an inert stub and
# TLS-configured connectors are skipped at bind time.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]

[dev-dependencies]
# Self-signed certificate generation for the TLS handshake tests.
rcgen = "0.14"
tempfile = "3"
