[package]
name = "tomcatrs-soak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Tomcat-RS soak / load-test harness — drives sustained traffic against a running tomcatrs instance and asserts memory / thread / latency stability"
publish = false

# The soaker is a stand-alone HTTP client. It deliberately does NOT depend on
# any `tomcatrs-*` crate — the server under test is a separate OS process,
# typically the `tomcatrs` CLI binary, so the soaker and the runtime can be
# built, deployed, and versioned independently.
[dependencies]
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "tomcatrs-soak"
path = "src/main.rs"
